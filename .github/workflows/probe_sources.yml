name: Probe candidate sources

# Manual only. Reports which candidate news feeds and aggregators are
# reachable from a GitHub runner - the network the ingest cron uses - so new
# sources are added on evidence rather than guesswork.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx feedparser
      - run: python backend/tools/probe_sources.py
