name: Public Pulse (every 6 hours)

# Reads the comment sections of viral Bangladeshi YouTube videos and posts
# the crowd's aggregated reaction to /api/v1/ingest/pulse. Needs a free
# YouTube Data API key in the YOUTUBE_API_KEY secret.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_videos:
        description: "Videos to analyse"
        required: false
        default: "15"
      dry_run:
        description: "Print the analysis instead of posting it"
        type: boolean
        required: false
        default: false

# Shares the ingest job's group: both call Gemini, and running together
# would trip its per-minute limit.
concurrency:
  group: osint-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost:5432/unused"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check secrets
        run: |
          missing=0
          for name in BACKEND_URL INGEST_API_KEY GEMINI_API_KEY YOUTUBE_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set."; missing=1; fi
          done
          exit $missing

      - name: Wake the backend
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$BACKEND_URL/health" || echo 000)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done

      - name: Collect and analyse
        run: |
          python backend/run_pulse.py \
            --max-videos "${{ github.event.inputs.max_videos || '15' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
