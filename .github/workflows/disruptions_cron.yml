name: Live disruptions (every 30 minutes)

# Blockades, hartals, rallies, clashes and road closures for the Live
# Disruptions map. Classifies headlines in batches, so a run costs one to a
# few Gemini calls.

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print instead of posting"
        type: boolean
        default: false

# Shares the ingest group so the two never call Gemini at the same time.
concurrency:
  group: osint-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disruptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost:5432/unused"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # v2: entries saved before the classifier returned places are not
      # final answers, so the cache starts fresh.
      - name: Restore classified-headline cache
        uses: actions/cache/restore@v4
        with:
          path: .disruption-cache/seen.json
          key: disruption-seen-v2-${{ github.run_id }}
          restore-keys: disruption-seen-v2-

      - name: Wake the backend
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$BACKEND_URL/health" || echo 000)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done

      - name: Collect and classify
        run: |
          python backend/run_disruptions.py --seen-cache .disruption-cache/seen.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Save classified-headline cache
        if: always() && hashFiles('.disruption-cache/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .disruption-cache/seen.json
          key: disruption-seen-v2-${{ github.run_id }}
