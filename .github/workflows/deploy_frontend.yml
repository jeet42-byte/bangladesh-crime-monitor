name: Deploy frontend to Vercel

# The Vercel project is not connected to GitHub, so a push to main never
# reached the live site on its own, and the dashboard's "Redeploy" rebuilds
# whatever was last uploaded from a laptop. This uploads frontend/ from main
# and builds it on Vercel, with the project's own environment variables.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_frontend.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The project behind bangladesh-crime-monitor.vercel.app.
      VERCEL_PROJECT: bangladesh-crime-monitor

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip when no token is configured
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set - nothing deployed. Create one at https://vercel.com/account/tokens and add it under Settings > Secrets > Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            # A secret pasted with a trailing newline makes Vercel answer
            # "User not found" - the same failure the Gemini key had.
            token="$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')"
            echo "::add-mask::$token"
            echo "VERCEL_TOKEN_CLEAN=$token" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link to the Vercel project
        if: steps.token.outputs.present == 'true'
        run: npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN_CLEAN"

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN_CLEAN"
